# Helm values for ${{ values.name }}
# Generated by the RHDH Multi-Agent Loan Origination template.
# This file is layered on top of the chart's default values.yaml.
# See: https://github.com/rh-ai-quickstart/multi-agent-loan-origination/tree/main/deploy/helm/mortgage-ai

global:
  imageRegistry: "${{ values.imageRegistry }}"
  imageRepository: "${{ values.imageRepository }}"
  imageTag: "${{ values.imageTag }}"
  imagePullPolicy: Always

secrets:
  # Database
  POSTGRES_DB: "${{ values.name }}"
  POSTGRES_USER: "user"
  POSTGRES_PASSWORD: "changeme"
  DATABASE_URL: "postgresql+asyncpg://user:changeme@${{ values.name }}-db:5432/${{ values.name }}"
  COMPLIANCE_DATABASE_URL: "postgresql+asyncpg://compliance_app:compliance_pass@${{ values.name }}-db:5432/${{ values.name }}"

  # API
  DEBUG: "false"
  ALLOWED_HOSTS: '["*"]'
  COMPANY_NAME: "${{ values.companyName }}"
  AGENT_NAME: ""

  # Auth
  AUTH_DISABLED: "${{ values.authDisabled }}"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_ISSUER: ""
  KEYCLOAK_REALM: "mortgage-ai"
  KEYCLOAK_CLIENT_ID: "mortgage-ai-ui"
  JWKS_CACHE_TTL: "300"

  # Storage (MinIO)
  S3_ENDPOINT: "http://minio:9000"
  S3_ACCESS_KEY: "minio"
  S3_SECRET_KEY: "miniosecret"
  S3_BUCKET: "documents"
  S3_REGION: "us-east-1"
  UPLOAD_MAX_SIZE_MB: "50"

  # LLM
  LLM_API_KEY: "${{ values.llmApiKey }}"
  LLM_BASE_URL: "${{ values.llmBaseUrl }}"
  LLM_MODEL: "${{ values.llmModel }}"

  # Vision (optional)
  VISION_MODEL: "${{ values.visionModel }}"
  VISION_BASE_URL: "${{ values.visionBaseUrl }}"
  VISION_API_KEY: ""

  # Embedding
  EMBEDDING_MODEL: ""
  EMBEDDING_PROVIDER: "${{ values.embeddingProvider }}"
  EMBEDDING_BASE_URL: ""
  EMBEDDING_API_KEY: ""

  # MCP risk server
  MCP_RISK_SERVER_URL: "http://mcp-risk-server:8081/mcp"
  PREDICTIVE_MODEL_MCP_URL: ""

  # Safety shields
  NEMO_GUARDRAILS_ENDPOINT: ""

  # Observability (MLflow)
  MLFLOW_TRACKING_URI: ""
  MLFLOW_EXPERIMENT_NAME: ""
  MLFLOW_WORKSPACE: ""
  MLFLOW_TRACKING_TOKEN: ""
  MLFLOW_TRACKING_INSECURE_TLS: "false"

  # Kagenti
  KAGENTI_ENABLED: "false"

  # Admin
  SQLADMIN_USER: "admin"
  SQLADMIN_PASSWORD: "admin"
  SQLADMIN_SECRET_KEY: "change-me-in-production"

  # Keycloak bootstrap
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"

  # MinIO
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "miniosecret"

# Routes
routes:
  enabled: true
  sharedHost: "${{ values.name }}-${{ values.namespace }}.${{ values.clusterDomain }}"
  ui:
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect
  api:
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

# API
api:
  enabled: true
  name: ${{ values.name }}-api
  image:
    repository: mortgage-ai-api
    tag: ${{ values.imageTag }}
  service:
    type: ClusterIP
    port: 8000
  replicas: 1
  resources:
    requests:
      memory: "1Gi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  healthCheck:
    enabled: true
    path: /health/
    initialDelaySeconds: 90
    periodSeconds: 10

# UI
ui:
  enabled: true
  name: ${{ values.name }}-ui
  image:
    repository: mortgage-ai-ui
    tag: ${{ values.imageTag }}
  service:
    type: ClusterIP
    port: 8080
  replicas: 1
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  healthCheck:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10

# Database
database:
  enabled: true
  name: ${{ values.name }}-db
  image:
    repository: pgvector/pgvector
    tag: pg16
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce

# Keycloak
keycloak:
  enabled: ${{ values.enableKeycloak }}
  name: keycloak
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"

# MinIO
minio:
  enabled: true
  name: minio
  image:
    repository: minio/minio
    tag: latest
  persistence:
    enabled: true
    size: 10Gi

# MLflow
mlflow:
  rbac:
    enabled: ${{ values.enableMLflow }}

# MCP Risk Server
mcpRiskServer:
  enabled: true
  name: mcp-risk-server
  image:
    repository: mortgage-ai-api
    tag: ${{ values.imageTag }}
  service:
    type: ClusterIP
    port: 8081

# Optional components (disabled by default -- enable via values override)
llamastack:
  enabled: false

nemoGuardrails:
  enabled: false

kagenti:
  enabled: false

# Seed data
seed:
  enabled: ${{ values.enableSeedData }}
