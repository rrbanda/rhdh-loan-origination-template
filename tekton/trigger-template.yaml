apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: loan-origination-deploy-template
  namespace: loan-origination
spec:
  params:
    - name: git-url
    - name: git-revision
    - name: repo-name
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: $(tt.params.repo-name)-run-
        namespace: loan-origination
        labels:
          app: $(tt.params.repo-name)
          backstage.io/kubernetes-id: $(tt.params.repo-name)
          tekton.dev/pipeline: loan-origination-ci
      spec:
        pipelineRef:
          name: loan-origination-ci
        params:
          - name: git-url
            value: $(tt.params.git-url)
          - name: git-revision
            value: $(tt.params.git-revision)
          - name: repo-name
            value: $(tt.params.repo-name)
          - name: deploy-namespace
            value: loan-origination
          - name: gitops-repo-url
            value: https://github.com/rrbanda/$(tt.params.repo-name)-gitops.git
        workspaces:
          - name: source
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 5Gi
          - name: gitops
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 256Mi
          - name: git-credentials
            secret:
              secretName: github-basic-auth
